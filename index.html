<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackwolf App</title>
    <!-- هذا هو السطر الصحيح والمحصن لاستدعاء الـ SDK -->
    https://minepi.com
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1a1a1a; color: white; padding: 50px; }
        .btn { background-color: #673ab7; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 5px; margin-top: 20px; }
        .btn:hover { background-color: #512da8; }
    </style>
</head>
<body>

    <h1>مرحباً بك في Blackwolf Community</h1>
    <p>تطبيقك الأول على شبكة Pi Network قيد التطوير والتحصين الآن.</p>
    
    <button class="btn" onclick="loginWithPi()">تسجيل الدخول عبر Pi</button>

    <script>
        // تهيئة الـ SDK في بيئة التجربة (Sandbox)
        Pi.init({ version: "2.0", sandbox: true });
        console.log("تم تحميل Pi SDK بنجاح");

        function loginWithPi() {
            alert("سيتم ربط حسابك بـ Pi بمجرد تفعيل الاستضافة السحابية!");
        }
    </script>
</body>
</html>
